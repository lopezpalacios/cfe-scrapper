name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build the reproducible image (x86_64-linux)
        run: nix build ".#scraper-image"
      - name: Load + smoke test the image
        run: |
          docker load < result
          docker run --rm --entrypoint "" ghcr.io/lopezpalacios/cfe-scrapper:latest \
            python3 -c "import worker; print('worker importable')"
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/lopezpalacios/cfe-scrapper:latest \
            ghcr.io/lopezpalacios/cfe-scrapper:${{ github.sha }}
          docker push ghcr.io/lopezpalacios/cfe-scrapper:latest
          docker push ghcr.io/lopezpalacios/cfe-scrapper:${{ github.sha }}
